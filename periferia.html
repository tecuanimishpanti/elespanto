<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Periferia — El Espanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --negro:        #06050a;
    --hueso:        #e8ddd0;
    --gris-med:     #6b6075;
    --gris-claro:   #9d90a8;

    --verde:        #8ab830;
    --verde-glow:   #c4f050;
    --magenta:      #d43a7a;
    --asfalto:      #16151c;

    --periferia:    #8ab830;
    --monte:        #3a7a44;
    --cruce:        #a02020;
    --umbral:       #c8a848;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--negro);
    color: var(--hueso);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
  }

  .grano {
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
    opacity: 0.55;
    mix-blend-mode: overlay;
  }

  .marca {
    position: fixed;
    top: 1.6rem; left: 2rem;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    text-decoration: none;
  }
  .marca svg { display: block; }
  .marca-texto {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gris-claro);
  }

  .nav-territorios {
    position: fixed;
    top: 1.9rem; right: 2rem;
    z-index: 100;
    display: flex;
    gap: 1.8rem;
  }
  .nav-territorios a {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--gris-med);
    transition: color 0.3s ease;
  }
  .nav-territorios a:hover { color: var(--hueso); }
  .nav-territorios a.activo { color: var(--verde); }

  @media (max-width: 720px) {
    .nav-territorios { display: none; }
  }

  /* ══════════════════════════════
     HERO — la fotografía es la protagonista.
     El marco ocupa casi toda la pantalla; el texto
     es una leyenda, no el centro de atención.
  ══════════════════════════════ */
  .hero {
    position: relative;
    height: 100vh;
    padding: 6.5rem 2rem 2rem;
    display: flex;
  }

  .hero-etiqueta-seccion {
    position: absolute;
    z-index: 2;
    top: 6.5rem; left: 2.6rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(232,221,208,0.4);
    opacity: 0;
    animation: sube 0.8s ease forwards 0s;
  }

  .marco-foto {
    position: relative;
    flex: 1;
    background: var(--asfalto);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .marco-foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* estado sin foto todavía — solo referencia visual para maquetar,
     se reemplaza por <img> cuando haya material propio */
  .marco-vacio {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(232,221,208,0.18);
    border: 1px dashed rgba(232,221,208,0.14);
    padding: 0.6em 1.2em;
  }

  .marco-foto::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(6,5,10,0.88) 0%, rgba(6,5,10,0.35) 32%, transparent 58%);
    pointer-events: none;
  }

  .hero-leyenda {
    position: absolute;
    z-index: 2;
    left: 2rem; bottom: 2.6rem;
    right: 2rem;
  }

  .hero-tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--negro);
    background: var(--verde);
    padding: 0.3em 0.7em;
    margin-bottom: 1.3rem;
    opacity: 0;
    animation: sube 0.8s ease forwards 0.1s;
  }

  .hero-titulo {
    font-family: 'IM Fell English', serif;
    font-weight: 400;
    font-size: clamp(3rem, 9.5vw, 6.6rem);
    line-height: 0.96;
    color: var(--hueso);
    margin-bottom: 1rem;
    opacity: 0;
    transform: rotate(-0.6deg);
    animation: sube 0.9s ease forwards 0.22s, titila-neon 5.5s ease-in-out infinite 1.4s;
    text-shadow:
      0 0 8px var(--verde-glow),
      0 0 26px rgba(138,184,48,0.5),
      2px 0 0 rgba(212,58,122,0.16),
      -2px 0 0 rgba(138,184,48,0.16);
  }

  @keyframes titila-neon {
    0%, 100% { opacity: 1; }
    41%      { opacity: 1; }
    42%      { opacity: 0.55; }
    43%      { opacity: 1; }
    44%      { opacity: 0.7; }
    45%      { opacity: 1; }
    78%      { opacity: 1; }
    79%      { opacity: 0.6; }
    80%      { opacity: 1; }
  }

  .hero-frase {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(1rem, 1.5vw, 1.25rem);
    color: rgba(232,221,208,0.62);
    opacity: 0;
    animation: sube 0.9s ease forwards 0.36s;
  }

  @keyframes sube {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-tag, .hero-titulo, .hero-frase { animation: none !important; opacity: 1; }
  }

  /* ══════════════════════════════
     ARCHIVO — hoja de contactos, como en una revista
     de fotografía de calle: miniaturas apretadas, sin
     jerarquía de texto, la imagen manda.
  ══════════════════════════════ */
  .archivo {
    position: relative;
    padding: 3.4rem 2rem 5rem;
    background: var(--negro);
  }

  .archivo-etiqueta {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(232,221,208,0.4);
    margin-bottom: 1.4rem;
  }

  .contactos {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }

  .contacto {
    aspect-ratio: 1 / 1;
    background: var(--asfalto);
    border: 1px dashed rgba(232,221,208,0.1);
  }

  @media (max-width: 900px) {
    .contactos { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 640px) {
    .hero { padding: 6rem 1rem 1rem; }
    .hero-leyenda { left: 1.2rem; right: 1.2rem; bottom: 1.6rem; }
    .archivo { padding: 2.6rem 1rem 3.5rem; }
    .contactos { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<a class="marca" href="index.html" aria-label="El Espanto — inicio">
  <svg viewBox="0 0 40 80" width="14" height="28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="luz-marca" cx="50%" cy="50%" r="60%">
        <stop offset="0%"   stop-color="#ffb98a" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#c8a848" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path d="M20,1 L16,18 L23,34 L14,52 L18,68 L20,79"
      fill="none" stroke="#e8ddd0" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M20,1 L16,18 L23,34 L14,52 L18,68 L20,79"
      fill="none" stroke="url(#luz-marca)" stroke-width="3.5"
      stroke-linecap="round" opacity="0.7"/>
  </svg>
  <span class="marca-texto">El Espanto</span>
</a>

<nav class="nav-territorios">
  <a class="activo" href="periferia.html">La Periferia</a>
  <a href="monte.html">El Monte</a>
  <a href="cruce.html">El Cruce</a>
  <a href="umbral.html">El Umbral</a>
</nav>

<section class="hero">
  <span class="hero-etiqueta-seccion">Pieza de la semana</span>

  <div class="marco-foto">
    <span class="marco-vacio">Fotografía — pendiente</span>

    <div class="hero-leyenda">
      <span class="hero-tag">Territorio urbano</span>
      <h1 class="hero-titulo">La Periferia</h1>
      <p class="hero-frase">Los márgenes también hablan.</p>
    </div>
  </div>
</section>

<section class="archivo">
  <span class="archivo-etiqueta">Archivo</span>
  <div class="contactos">
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
    <div class="contacto"></div>
  </div>
</section>

<div class="grano"></div>

</body>
</html>
