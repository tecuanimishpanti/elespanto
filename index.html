<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Espanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --negro:       #06050a;
    --humo:        #110f18;
    --ceniza:      #1c1826;
    --gris-polvo:  #352e45;
    --gris-med:    #6b6075;
    --gris-claro:  #9d90a8;
    --hueso:       #e8ddd0;
    --papel:       #c8bfb0;
    --neon:        #ff4a1f;
    --neon-glow:   #ff8a3d;
    --dorado:      #c8a848;
    --dorado-suave:#e0c07a;
  }

  html, body { height: 100%; }

  body {
    background: var(--negro);
    color: var(--hueso);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
  }

  /* ══════════════════════════════
     GRANO FOTOGRÁFICO
  ══════════════════════════════ */
  .grano {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  /* ══════════════════════════════
     FONDO — radiales de color + humo a la deriva
  ══════════════════════════════ */
  .escena {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 60%, rgba(122,26,26,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 15% 25%, rgba(168,132,42,0.04) 0%, transparent 65%),
      radial-gradient(ellipse 35% 45% at 85% 75%, rgba(26,48,24,0.07) 0%, transparent 60%),
      var(--negro);
  }

  .humo {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .humo-capa {
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at center, rgba(50,40,65,0.12) 0%, transparent 60%);
    animation: deriva linear infinite;
  }
  .humo-capa:nth-child(1) { top:-50%; left:-50%; animation-duration:28s; }
  .humo-capa:nth-child(2) { top:-30%; left:-20%; animation-duration:38s; animation-delay:-12s; opacity:0.6; }
  .humo-capa:nth-child(3) { top:-45%; left:-55%; animation-duration:50s; animation-delay:-22s; opacity:0.3; }

  @keyframes deriva {
    0%   { transform: translate(0,0) rotate(0deg); }
    33%  { transform: translate(4%,3%) rotate(8deg); }
    66%  { transform: translate(-3%,5%) rotate(-6deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }

  /* ══════════════════════════════
     MANIFESTACIONES
     espectros extraídos de fotografías reales de campo —
     presagios, a pantalla completa, de lo que hay dentro
  ══════════════════════════════ */
  .manifestaciones {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .manifestacion {
    position: absolute;
    opacity: 0;
    filter: blur(1.5px);
    mix-blend-mode: screen;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    will-change: opacity, transform;
  }

  /* mano y cuenco — cruzando desde la izquierda, altura media */
  .m-manos {
    top: 8%; left: -6%;
    width: min(58vw, 780px);
    animation-name: aparece-a;
    animation-duration: 11s;
    animation-delay: 0.2s;
  }

  /* escena ritual — de fondo, grande, detrás del título */
  .m-ritual {
    top: 4%; right: -10%;
    width: min(62vw, 820px);
    animation-name: aparece-b;
    animation-duration: 13s;
    animation-delay: 2s;
  }

  /* aves en los cables — cruzan arriba, como un presagio */
  .m-aves {
    top: -4%; left: 12%;
    width: min(72vw, 980px);
    animation-name: aparece-c;
    animation-duration: 12s;
    animation-delay: 4s;
  }

  /* vendedora de mercado — abajo, más cerca */
  .m-mercado {
    bottom: -8%; right: -4%;
    width: min(38vw, 460px);
    animation-name: aparece-a;
    animation-duration: 10s;
    animation-delay: 6s;
  }

  /* farol — punto de luz cálida real, abajo centro */
  .m-farol {
    bottom: 5%; left: 50%;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--dorado-suave);
    box-shadow: 0 0 18px 6px rgba(224,192,122,0.5), 0 0 60px 24px rgba(224,192,122,0.1);
    animation-name: titila;
    animation-duration: 3.4s;
    animation-delay: 0s;
  }

  @keyframes aparece-a {
    0%, 45%   { opacity: 0; transform: translateY(10px) scale(0.98); }
    62%       { opacity: 0.16; transform: translateY(0) scale(1); }
    82%       { opacity: 0.16; transform: translateY(0) scale(1); }
    100%      { opacity: 0; transform: translateY(-8px) scale(1.01); }
  }
  @keyframes aparece-b {
    0%, 35%   { opacity: 0; transform: translateY(8px) scale(0.99); }
    52%       { opacity: 0.13; transform: translateY(0) scale(1); }
    76%       { opacity: 0.13; transform: translateY(0) scale(1); }
    100%      { opacity: 0; transform: translateY(-10px) scale(1.02); }
  }
  @keyframes aparece-c {
    0%, 55%   { opacity: 0; transform: translateY(6px) scale(0.985); }
    70%       { opacity: 0.11; transform: translateY(0) scale(1); }
    88%       { opacity: 0.11; transform: translateY(0) scale(1); }
    100%      { opacity: 0; transform: translateY(-6px) scale(1.01); }
  }
  @keyframes titila {
    0%, 100% { opacity: 1; }
    45%      { opacity: 0.4; }
    60%      { opacity: 0.9; }
    75%      { opacity: 0.55; }
  }

  /* ══════════════════════════════
     MARCA — ESQUINA SUPERIOR IZQUIERDA
  ══════════════════════════════ */
  .marca {
    position: fixed;
    top: 1.6rem; left: 2rem;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    text-decoration: none;
    opacity: 0;
    animation: fade-in 1.2s ease forwards 2.6s;
  }
  .marca svg { display: block; }
  .marca-texto {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gris-claro);
  }

  /* ══════════════════════════════
     HERO
  ══════════════════════════════ */
  .hero {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8vh 2rem 0;
    text-align: center;
  }

  .logo {
    font-family: 'IM Fell English', serif;
    font-weight: 400;
    font-size: clamp(4rem, 17vw, 12.5rem);
    letter-spacing: 0.005em;
    white-space: nowrap;
    line-height: 1;
    color: var(--hueso);
    opacity: 0;
    animation: emerge 1.8s ease forwards 0.5s, flicker 6s ease-in-out infinite 2.4s;
    text-shadow:
      0 0 8px var(--neon-glow),
      0 0 22px var(--neon-glow),
      0 0 46px rgba(255, 74, 31, 0.5),
      0 0 96px rgba(255, 74, 31, 0.28),
      0 0 170px rgba(255, 74, 31, 0.14);
  }

  @keyframes emerge {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes flicker {
    0%, 100%  { opacity: 1; }
    3%        { opacity: 0.8; }
    6%        { opacity: 1; }
    7%        { opacity: 0.5; }
    8%        { opacity: 1; }
    52%       { opacity: 1; }
    53%       { opacity: 0.68; }
    54%       { opacity: 1; }
  }

  .entrar {
    margin-top: 2.8rem;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    opacity: 0;
    animation: fade-in 1.4s ease forwards 2.3s;
  }

  .entrar-texto {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--dorado-suave);
    transition: color 0.4s ease, letter-spacing 0.4s ease;
  }

  .entrar-linea {
    width: 34px;
    height: 1px;
    background: var(--dorado);
    opacity: 0.6;
    transition: width 0.4s ease, opacity 0.4s ease;
  }

  .entrar:hover .entrar-texto {
    color: var(--hueso);
    letter-spacing: 0.5em;
  }
  .entrar:hover .entrar-linea {
    width: 52px;
    opacity: 1;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .entrar, .marca, .manifestacion, .humo-capa {
      animation: none !important;
      opacity: 1;
    }
    .manifestacion { opacity: 0.1; }
    .m-farol { opacity: 1; }
  }

  @media (max-width: 640px) {
    .logo { font-size: clamp(2.6rem, 15vw, 4.2rem); letter-spacing: 0; }
    .marca-texto { font-size: 0.54rem; letter-spacing: 0.18em; }
  }
</style>
</head>

<div class="grano"></div>

<script>
  const capa = document.querySelector('.manifestaciones');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!prefersReduced && window.matchMedia('(hover: hover)').matches) {
    let tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('mousemove', (e) => {
      tx = (e.clientX / window.innerWidth - 0.5) * 10;
      ty = (e.clientY / window.innerHeight - 0.5) * 10;
    });
    function loop() {
      cx += (tx - cx) * 0.04;
      cy += (ty - cy) * 0.04;
      capa.style.transform = `translate(${cx}px, ${cy}px)`;
      requestAnimationFrame(loop);
    }
    loop();
  }
</script>
