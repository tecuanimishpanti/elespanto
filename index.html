       APARICIONES
       Cada .aparicion es un placeholder de silueta ambigua.

         2. En .aparicion__forma, sustituye el fondo negro por:
              background-image: url("images/aparicion/tu-foto.jpg");
              background-size: cover;
              mix-blend-mode: screen;  (suele integrarse bien sobre negro)
       ============================================================ -->
