<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Cruce — El Espanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --negro:        #0a0808;
    --piedra:       #171413;
    --piedra-clara: #241f1e;
    --hueso:        #e4dcd2;
    --gris-med:     #8a7c76;
    --gris-claro:   #b3a89f;

    --sangre:       #8f2020;
    --sangre-viva:  #b8342f;

    --periferia:    #6f9a2c;
    --monte:        #4a6b4a;
    --cruce:        #8f2020;
    --umbral:       #a3822f;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--negro);
    color: var(--hueso);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
  }

  .grano {
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.09'/%3E%3C/svg%3E");
    opacity: 0.6;
    mix-blend-mode: overlay;
  }

  .marca {
    position: fixed;
    top: 1.6rem; left: 2rem;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    text-decoration: none;
  }
  .marca svg { display: block; }
  .marca-texto {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gris-claro);
  }

  .nav-territorios {
    position: fixed;
    top: 1.9rem; right: 2rem;
    z-index: 100;
    display: flex;
    gap: 1.8rem;
  }
  .nav-territorios a {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--gris-med);
    transition: color 0.4s ease;
  }
  .nav-territorios a:hover { color: var(--hueso); }
  .nav-territorios a.activo { color: var(--sangre-viva); }

  @media (max-width: 720px) {
    .nav-territorios { display: none; }
  }

  /* ══════════════════════════════
     HERO — monumento. Simétrico, centrado,
     como una inscripción en piedra.
  ══════════════════════════════ */
  .hero {
    position: relative;
    min-height: 62vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 9rem 2rem 4rem;
    overflow: hidden;
  }

  .hero-fondo {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 55% at 50% 40%, rgba(143,32,32,0.09) 0%, transparent 70%),
      var(--negro);
  }

  .hero-contenido {
    position: relative;
    z-index: 1;
    max-width: 620px;
  }

  .regla {
    width: 46px;
    height: 1px;
    background: var(--sangre-viva);
    opacity: 0.5;
    margin: 0 auto 1.6rem;
  }

  .hero-tag {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gris-claro);
    margin-bottom: 1.8rem;
  }

  .hero-titulo {
    font-family: 'IM Fell English', serif;
    font-weight: 400;
    font-size: clamp(3.2rem, 8vw, 5.6rem);
    line-height: 1;
    color: var(--hueso);
    margin-bottom: 1.6rem;
    text-shadow: 0 0 40px rgba(143,32,32,0.25);
  }

  .hero-frase {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(1rem, 1.5vw, 1.25rem);
    color: rgba(228,220,210,0.55);
  }

  /* ══════════════════════════════
     ARCHIVO — mitad archivero, mitad pizarra
     de personas desaparecidas. Fichas ancladas
     con un alfiler, ligeramente desalineadas,
     unidas por hilos finos como en una investigación.
  ══════════════════════════════ */
  .archivo {
    position: relative;
    max-width: 1300px;
    margin: 0 auto;
    padding: 3rem 3rem 9rem;
    border-top: 1px solid rgba(228,220,210,0.08);
  }

  .archivo-etiqueta {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gris-med);
    margin: 3.2rem 0 3.4rem;
  }

  .tablero {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3.2rem 2rem;
  }

  .ficha {
    position: relative;
    aspect-ratio: 3 / 4;
    background: var(--piedra);
    border: 1px solid rgba(228,220,210,0.1);
    box-shadow: 0 14px 26px rgba(0,0,0,0.4);
  }
  .ficha:nth-child(1) { transform: rotate(-1.4deg); }
  .ficha:nth-child(2) { transform: rotate(0.9deg); margin-top: 1.4rem; }
  .ficha:nth-child(3) { transform: rotate(-0.6deg); }
  .ficha:nth-child(4) { transform: rotate(1.6deg); margin-top: 0.8rem; }
  .ficha:nth-child(5) { transform: rotate(0.7deg); }
  .ficha:nth-child(6) { transform: rotate(-1.1deg); margin-top: 1.1rem; }
  .ficha:nth-child(7) { transform: rotate(1.2deg); }
  .ficha:nth-child(8) { transform: rotate(-0.5deg); margin-top: 0.6rem; }

  .ficha::before {
    /* el alfiler */
    content: '';
    position: absolute;
    top: -5px; left: 50%;
    transform: translateX(-50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sangre-viva);
    box-shadow: 0 0 5px rgba(184,52,47,0.6);
  }

  .ficha-interior {
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(228,220,210,0.14);
  }

  .ficha-numero {
    position: absolute;
    bottom: 7px; right: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.52rem;
    letter-spacing: 0.08em;
    color: rgba(228,220,210,0.22);
  }

  /* hilos que conectan algunas fichas, como en una investigación */
  .hilo {
    position: absolute;
    height: 1px;
    background: rgba(184,52,47,0.28);
    transform-origin: left center;
    pointer-events: none;
  }

  @media (max-width: 900px) {
    .tablero { grid-template-columns: repeat(3, 1fr); }
    .hilo { display: none; }
  }
  @media (max-width: 600px) {
    .tablero { grid-template-columns: repeat(2, 1fr); gap: 2.4rem 1.2rem; }
    .ficha { transform: none !important; margin-top: 0 !important; }
  }
</style>
</head>
<body>

<a class="marca" href="index.html" aria-label="El Espanto — inicio">
  <svg viewBox="0 0 40 80" width="14" height="28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="luz-marca" cx="50%" cy="50%" r="60%">
        <stop offset="0%"   stop-color="#e4a08a" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#8f2020" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path d="M20,1 L16,18 L23,34 L14,52 L18,68 L20,79"
      fill="none" stroke="#e4dcd2" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M20,1 L16,18 L23,34 L14,52 L18,68 L20,79"
      fill="none" stroke="url(#luz-marca)" stroke-width="3"
      stroke-linecap="round" opacity="0.6"/>
  </svg>
  <span class="marca-texto">El Espanto</span>
</a>

<nav class="nav-territorios">
  <a href="periferia.html">La Periferia</a>
  <a href="monte.html">El Monte</a>
  <a class="activo" href="cruce.html">El Cruce</a>
  <a href="umbral.html">El Umbral</a>
</nav>

<section class="hero">
  <div class="hero-fondo"></div>
  <div class="hero-contenido">
    <span class="hero-tag">Memoria y territorio</span>
    <div class="regla"></div>
    <h1 class="hero-titulo">El Cruce</h1>
    <p class="hero-frase">Hay historias que todavía muerden.</p>
  </div>
</section>

<section class="archivo">
  <span class="archivo-etiqueta">Archivo</span>

  <div class="tablero">
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">001</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">002</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">003</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">004</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">005</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">006</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">007</span></div>
    <div class="ficha"><div class="ficha-interior"></div><span class="ficha-numero">008</span></div>
  </div>
</section>

<div class="grano"></div>

</body>
</html>
