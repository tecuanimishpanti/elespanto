<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Umbral — El Espanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blanco:       #fdfcfa;
    --hueso-claro:  #f1ede4;
    --tinta:        #201d1a;
    --tinta-suave:  #58524a;
    --gris-med:     #a49a86;

    --dorado:       #a3822f;
    --dorado-suave: #c9a24d;

    --periferia:    #6f9a2c;
    --monte:        #4a6b4a;
    --cruce:        #8f2020;
    --umbral:       #a3822f;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--blanco);
    color: var(--tinta);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
  }

  .marca {
    position: fixed;
    top: 1.6rem; left: 2rem;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    text-decoration: none;
  }
  .marca svg { display: block; }
  .marca-texto {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--tinta-suave);
  }

  .nav-territorios {
    position: fixed;
    top: 1.9rem; right: 2rem;
    z-index: 100;
    display: flex;
    gap: 1.8rem;
  }
  .nav-territorios a {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--gris-med);
    transition: color 0.4s ease;
  }
  .nav-territorios a:hover { color: var(--tinta); }
  .nav-territorios a.activo { color: var(--dorado); }

  @media (max-width: 720px) {
    .nav-territorios { display: none; }
  }

  /* ══════════════════════════════
     HERO — portada de revista, vertical, muy limpia.
     Inspirado en Atmos: la foto es la portada.
  ══════════════════════════════ */
  .hero {
    position: relative;
    padding: 8rem 6vw 4rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .hero-etiqueta {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gris-med);
    margin-bottom: 1.6rem;
    opacity: 0;
    animation: aparece 0.9s ease forwards 0.1s;
  }

  .portada {
    position: relative;
    aspect-ratio: 3 / 4;
    max-height: 78vh;
    margin: 0 auto;
    background: var(--hueso-claro);
    overflow: hidden;
    opacity: 0;
    animation: aparece 1.1s ease forwards 0.22s;
  }
  .portada img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .marco-vacio {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gris-med);
    border: 1px dashed rgba(32,29,26,0.14);
    margin: 1px;
  }

  .portada-leyenda {
    position: absolute;
    z-index: 2;
    left: 2.2rem; bottom: 2.2rem; right: 2.2rem;
  }
  .portada::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(20,17,12,0.55) 0%, transparent 45%);
    pointer-events: none;
  }

  .hero-tag {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--dorado-suave);
    margin-bottom: 1rem;
  }

  .hero-titulo {
    font-family: 'IM Fell English', serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 6.5vw, 5rem);
    line-height: 1;
    color: #fdfcfa;
    margin-bottom: 0.8rem;
  }

  .hero-frase {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    color: rgba(253,252,250,0.78);
  }

  @keyframes aparece {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ══════════════════════════════
     ARCHIVO — mosaico denso, la foto manda.
     Inspirado en la retícula de Atmos.
  ══════════════════════════════ */
  .archivo {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 6vw 8rem;
  }

  .archivo-etiqueta {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gris-med);
    margin: 3rem 0 2.2rem;
  }

  .mosaico {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 14vw;
    gap: 0.6rem;
  }

  .celda {
    display: block;
    background: var(--hueso-claro);
    border: 1px dashed rgba(32,29,26,0.1);
    overflow: hidden;
    position: relative;
  }
  .celda img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .celda.grande  { grid-column: span 3; grid-row: span 2; }
  .celda.media   { grid-column: span 2; grid-row: span 1; }
  .celda.chica   { grid-column: span 2; grid-row: span 1; }
  .celda.vertical{ grid-column: span 2; grid-row: span 2; }

  @media (max-width: 900px) {
    .mosaico { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 22vw; }
    .celda.grande, .celda.vertical { grid-column: span 4; grid-row: span 2; }
    .celda.media, .celda.chica { grid-column: span 2; grid-row: span 1; }
  }
  @media (max-width: 560px) {
    .mosaico { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 40vw; }
    .celda.grande, .celda.vertical, .celda.media, .celda.chica { grid-column: span 2; grid-row: span 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-etiqueta, .portada { animation: none !important; opacity: 1; }
  }
</style>
</head>
<body>

<a class="marca" href="index.html" aria-label="El Espanto — inicio">
  <svg viewBox="0 0 40 80" width="14" height="28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M20,1 L16,18 L23,34 L14,52 L18,68 L20,79"
      fill="none" stroke="#201d1a" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </svg>
  <span class="marca-texto">El Espanto</span>
</a>

<nav class="nav-territorios">
  <a href="periferia.html">La Periferia</a>
  <a href="monte.html">El Monte</a>
  <a href="cruce.html">El Cruce</a>
  <a class="activo" href="umbral.html">El Umbral</a>
</nav>

<section class="hero">
  <span class="hero-etiqueta">Pieza del mes</span>
  <div class="portada">
    <span class="marco-vacio">Fotografía — pendiente</span>
    <div class="portada-leyenda">
      <span class="hero-tag">Lo numinoso</span>
      <h1 class="hero-titulo">El Umbral</h1>
      <p class="hero-frase">El registro de lo que no se ve.</p>
    </div>
  </div>
</section>

<section class="archivo">
  <span class="archivo-etiqueta">Archivo</span>
  <div class="mosaico">
    <a class="celda grande" href="umbral-01-fe-mercado-central.html"><img src="umbral-01-fe-mercado-central-img01.jpg" alt=""></a>
    <div class="celda media"></div>
    <div class="celda chica"></div>
    <div class="celda vertical"></div>
    <div class="celda media"></div>
    <div class="celda chica"></div>
    <div class="celda chica"></div>
    <div class="celda grande"></div>
  </div>
</section>

</body>
</html>
